[project]
name = "markov-chain-text-generator"
version = "0.1.0"
description = "An n-gram Markov chain language model in pure Python: word- and character-level generation of any order, smoothing, held-out perplexity and a command-line interface."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafferty Carter-Lazenbury" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=markov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["markov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
